# YAML anchors for DRY configuration
x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  volumes:
  - ${VOLUME_PATH}:/app/data
  - ${VOLUME_PATH}/music:/music
  - ${VOLUME_PATH}/songs:/songs
  environment:
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - JANUS_HOST=host.docker.internal
  - JANUS_HTTP_PORT=8100
  - JANUS_ADMIN_PORT=8101
  - JANUS_WS_PORT=8188
  - MPD_USER_HOST=mpd-user
  - MPD_USER_PORT=6600
  - MPD_FALLBACK_HOST=mpd-fallback
  - MPD_FALLBACK_PORT=6601
  - LIQUIDSOAP_TELNET_HOST=liquidsoap
  - LIQUIDSOAP_TELNET_PORT=1234
  - DATA_PATH=/app/data
  - RECORDINGS_PATH=/app/data/recordings
  - ROOT_PATH=/api
  - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
  - LIQUIDSOAP_TOKEN=${LIQUIDSOAP_TOKEN}
  - JWT_SECRET=${JWT_SECRET}
  - LOG_LEVEL=${LOG_LEVEL:-INFO}
  - DEBUG=${DEBUG}
  - RELOAD=${RELOAD}
  depends_on:
  - redis
  - janus
  - mpd-user
  - mpd-fallback
  restart: unless-stopped

# Dev-specific configuration (extends backend-common)
x-backend-dev: &backend-dev
  <<: *backend-common
  command: ["uv", "run", "python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  volumes:
  - ./backend/app:/app/app
  - ${VOLUME_PATH}:/app/data
  - ${VOLUME_PATH}/music:/music
  - ${VOLUME_PATH}/songs:/songs

# Frontend common configuration
x-frontend-common: &frontend-common
  container_name: frontend
  volumes:
  - ${VOLUME_PATH}/caddy/logs:/var/log/caddy
  ports:
  - '80:80'
  depends_on:
  - janus
  - liquidsoap
  restart: unless-stopped

services:
  # Backend instances - Production profile (static build)
  main-1:
    <<: *backend-common
    container_name: main-1
    profiles: ["production", ""]

  main-2:
    <<: *backend-common
    container_name: main-2
    profiles: ["production", ""]

  main-3:
    <<: *backend-common
    container_name: main-3
    profiles: ["production", ""]

  # Backend instances - Development profile (all 3 with hot reload)
  main-1-dev:
    <<: *backend-dev
    container_name: main-1
    profiles: ["dev"]

  main-2-dev:
    <<: *backend-dev
    container_name: main-2
    profiles: ["dev"]

  main-3-dev:
    <<: *backend-dev
    container_name: main-3
    profiles: ["dev"]

  webhook_worker:
    container_name: webhook_worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.services.webhook_worker"]
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - MPD_USER_HOST=mpd-user
    - MPD_USER_PORT=6600
    - MPD_FALLBACK_HOST=mpd-fallback
    - MPD_FALLBACK_PORT=6601
    - LIQUIDSOAP_TELNET_HOST=liquidsoap
    - LIQUIDSOAP_TELNET_PORT=1234
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
    - redis
    - liquidsoap
    - mpd-user
    - mpd-fallback
    restart: unless-stopped

  recording_worker:
    container_name: recording_worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.services.recording_worker"]
    volumes:
    - ${VOLUME_PATH}:/app/data
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - LIQUIDSOAP_RECORDING_HOST=liquidsoap
    - LIQUIDSOAP_RECORDING_PORT=8004
    - DATA_PATH=/app/data
    - RECORDINGS_PATH=/app/data/recordings
    - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
    - JWT_SECRET=${JWT_SECRET}
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
    - redis
    - liquidsoap
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    command:
    - redis-server
    - --save
    - '60'
    - '1'
    - --save
    - '300'
    - '10'
    - --save
    - '900'
    - '1000'
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    volumes:
    - ${VOLUME_PATH}/redis:/data
    ports:
    - '6379:6379'
    restart: unless-stopped

  mpd-user:
    image: gists/mpd:latest
    container_name: mpd-user
    user: root
    volumes:
    - ${VOLUME_PATH}/music:/music
    - ${VOLUME_PATH}/mpd-user:/var/lib/mpd:rw
    - ./mpd/mpd.conf:/etc/mpd.conf:ro
    ports:
    - '6600:6600'
    - '8001:8001'

  mpd-fallback:
    image: gists/mpd:latest
    container_name: mpd-fallback
    user: root
    volumes:
    - ${VOLUME_PATH}/music:/music
    - ${VOLUME_PATH}/mpd-fallback:/var/lib/mpd:rw
    - ./mpd/mpd-fallback.conf:/etc/mpd.conf:ro
    ports:
    - '6601:6601'
    - '8002:8002'

  liquidsoap:
    image: savonet/liquidsoap:v2.4.0
    container_name: liquidsoap
    user: root
    volumes:
    - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
    - ./liquidsoap/default_transition.mp3:/etc/liquidsoap/default_transition.mp3:ro
    - ${VOLUME_PATH}/transitions:/transitions:ro
    - ${VOLUME_PATH}/recordings:/recordings:rw
    environment:
    - JANUS_HOST=host.docker.internal
    - JANUS_RTP_PORT=5002
    - MPD_USER_HOST=mpd-user
    - MPD_USER_PORT=8001
    - MPD_FALLBACK_HOST=mpd-fallback
    - MPD_FALLBACK_PORT=8002
    - BACKEND_HOST=frontend
    - BACKEND_PORT=80
    - BACKEND_BASE_PATH=/api
    - LIQUIDSOAP_TOKEN=${LIQUIDSOAP_TOKEN}
    ports:
    - '8000:8000'  # Telnet interface
    - '8004:8004'  # HTTP stream for recording worker
    - '8003:8003'  # HTTP stream for recording worker
    depends_on:
    - mpd-user
    - mpd-fallback
    - janus
    restart: unless-stopped
    command: /etc/liquidsoap/radio.liq

  janus:
    image: canyan/janus-gateway:latest
    container_name: janus
    network_mode: host
    # Note: Uses host networking to resolve mDNS candidates from browser
    volumes:
    - ./janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
    - ./janus/janus.transport.http.local.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
    - ./janus/janus.plugin.streaming.jcfg:/usr/local/etc/janus/janus.plugin.streaming.jcfg:ro
    restart: unless-stopped
    command: ["/usr/local/bin/janus", "--configs-folder=/usr/local/etc/janus"]

  # Frontend - Production: multi-stage build
  frontend:
    <<: *frontend-common
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
    - main-1
    - main-2
    - main-3
    - janus
    - liquidsoap
    profiles: ["production", ""]

  # Frontend - Development: serve locally built files
  frontend-dev:
    <<: *frontend-common
    image: caddy:2-alpine
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - ./frontend/build:/srv:ro
    - ${VOLUME_PATH}/caddy/logs:/var/log/caddy
    depends_on:
    - main-1-dev
    - main-2-dev
    - main-3-dev
    - janus
    - liquidsoap
    profiles: ["dev"]

networks:
  default:
    driver: bridge
