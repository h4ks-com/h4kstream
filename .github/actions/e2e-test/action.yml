name: 'E2E Tests'
description: 'Run end-to-end tests with Docker Compose'

runs:
  using: 'composite'
  steps:
  - name: Copy .env.example to .env
    shell: bash
    run: cp .env.example .env

  - name: install ffmpeg
    shell: bash
    run: sudo apt-get update && sudo apt-get install -y ffmpeg

  - name: Install uv
    uses: astral-sh/setup-uv@v7
    with:
      enable-cache: true
      cache-dependency-glob: 'e2e/uv.lock'

  - name: Set up Python for e2e
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'

  - name: Install e2e dependencies
    shell: bash
    working-directory: e2e
    run: uv sync

  - name: Install pre-commit
    shell: bash
    run: uv tool install pre-commit

  - name: Run e2e linting
    shell: bash
    working-directory: e2e
    run: make check

  - name: Create data directories
    shell: bash
    run: |
      mkdir -p data/music/user data/music/fallback data/recordings data/transitions data/db
      chmod -R 777 data

  - name: Build and start Docker Compose
    shell: bash
    run: docker compose up -d --build

  - name: Wait for services to be healthy
    shell: bash
    run: |
      echo "Waiting for services to start..."
      timeout 120 bash -c 'until curl -f http://localhost/api/health > /dev/null 2>&1; do sleep 2; done'
      echo "API is up!"

  - name: Run E2E tests
    shell: bash
    working-directory: e2e
    run: make test

  - name: Show Docker logs on failure
    if: failure()
    shell: bash
    run: docker compose logs

  - name: Stop Docker Compose
    if: always()
    shell: bash
    run: docker compose down -v
