name: 'Frontend Check'
description: 'Run frontend TypeScript checking and build'

runs:
  using: 'composite'
  steps:
  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
      node-version: '20'
      cache: 'npm'
      cache-dependency-path: 'frontend/package-lock.json'

  - name: Install frontend dependencies
    shell: bash
    working-directory: frontend
    run: make install

  - name: Run TypeScript type checking
    shell: bash
    working-directory: frontend
    run: make check

  - name: Build frontend
    shell: bash
    working-directory: frontend
    run: make build
