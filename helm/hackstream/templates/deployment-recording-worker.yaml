{{- if .Values.recordingWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hackstream.fullname" . }}-recording-worker
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording-worker
  {{- with .Values.recordingWorker.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hackstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: recording-worker
  template:
    metadata:
      labels:
        {{- include "hackstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recording-worker
    spec:
      containers:
        - name: recording-worker
          image: "{{ .Values.recordingWorker.image.repository }}:{{ .Values.recordingWorker.image.tag }}"
          imagePullPolicy: {{ .Values.recordingWorker.image.pullPolicy }}
          command: ["uv", "run", "python", "-m", "app.services.recording_worker"]
          env:
            - name: REDIS_HOST
              value: {{ include "hackstream.fullname" . }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: LIQUIDSOAP_RECORDING_HOST
              value: {{ include "hackstream.fullname" . }}-liquidsoap
            - name: LIQUIDSOAP_RECORDING_PORT
              value: "8004"
            - name: DATA_PATH
              value: "/app/data"
            - name: RECORDINGS_PATH
              value: "/app/data/recordings"
            - name: LOG_LEVEL
              value: {{ .Values.recordingWorker.env.LOG_LEVEL | quote }}
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hackstream.fullname" . }}-secrets
                  key: ADMIN_API_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hackstream.fullname" . }}-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.recordingWorker.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hackstream.fullname" . }}-recordings
{{- end }}
