{{- if .Values.persistence.recordings.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hackstream.fullname" . }}-recordings
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - {{ .Values.persistence.recordings.accessMode }}
  {{- if .Values.persistence.recordings.storageClass }}
  storageClassName: {{ .Values.persistence.recordings.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.recordings.size }}
{{- end }}
