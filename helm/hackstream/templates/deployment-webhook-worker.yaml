{{- if .Values.webhookWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hackstream.fullname" . }}-webhook-worker
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hackstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook-worker
  template:
    metadata:
      labels:
        {{- include "hackstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webhook-worker
    spec:
      containers:
        - name: webhook-worker
          image: "{{ .Values.webhookWorker.image.repository }}:{{ .Values.webhookWorker.image.tag }}"
          imagePullPolicy: {{ .Values.webhookWorker.image.pullPolicy }}
          command: ["uv", "run", "python", "-m", "app.services.webhook_worker"]
          env:
            - name: REDIS_HOST
              value: {{ include "hackstream.fullname" . }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: MPD_USER_HOST
              value: {{ include "hackstream.fullname" . }}-mpd-user
            - name: MPD_USER_PORT
              value: "6600"
            - name: MPD_FALLBACK_HOST
              value: {{ include "hackstream.fullname" . }}-mpd-fallback
            - name: MPD_FALLBACK_PORT
              value: "6601"
            - name: LIQUIDSOAP_TELNET_HOST
              value: {{ include "hackstream.fullname" . }}-liquidsoap
            - name: LIQUIDSOAP_TELNET_PORT
              value: "1234"
            - name: LOG_LEVEL
              value: {{ .Values.webhookWorker.env.LOG_LEVEL | quote }}
          resources:
            {{- toYaml .Values.webhookWorker.resources | nindent 12 }}
{{- end }}
