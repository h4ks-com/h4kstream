{{- if .Values.mpdUser.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hackstream.fullname" . }}-mpd-user
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: mpd-user
spec:
  type: ClusterIP
  ports:
    - port: 6600
      targetPort: mpd
      protocol: TCP
      name: mpd
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hackstream.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mpd-user
{{- end }}
