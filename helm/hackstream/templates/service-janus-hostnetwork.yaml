{{- if and .Values.janus.enabled .Values.janus.hostNetwork }}
---
# Service for Janus when using hostNetwork mode
# Since Janus runs on the host network, we create a ClusterIP service
# with manually defined endpoints pointing to the node IP
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hackstream.fullname" . }}-janus
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: janus
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  ports:
    - port: 8088
      protocol: TCP
      name: http
    - port: 8188
      protocol: TCP
      name: websocket
---
# Endpoints for Janus pointing to the Kubernetes node
# Janus uses hostNetwork, so it's accessible at the node's IP
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ include "hackstream.fullname" . }}-janus
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: janus
subsets:
  - addresses:
      # Use the node's internal IP where Janus is running
      # In a single-node cluster, this will be the only node
      # For multi-node, use nodeSelector to pin Janus to a specific node
      {{- if .Values.janus.nodeIP }}
      - ip: {{ .Values.janus.nodeIP }}
      {{- else }}
      # Auto-detect: Use the first node's internal IP
      # This works for single-node clusters
      - ip: {{ (first .Values.global.nodeIPs) | default "192.168.2.210" }}
      {{- end }}
    ports:
      - port: 8088
        protocol: TCP
        name: http
      - port: 8188
        protocol: TCP
        name: websocket
{{- end }}
