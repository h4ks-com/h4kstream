apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hackstream.fullname" . }}-backend
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.backend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hackstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "hackstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: {{ include "hackstream.fullname" . }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: JANUS_HOST
              {{- if .Values.janus.hostNetwork }}
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
              {{- else }}
              value: {{ include "hackstream.fullname" . }}-janus
              {{- end }}
            - name: JANUS_HTTP_PORT
              value: "8088"
            - name: JANUS_WS_PORT
              value: "8188"
            - name: MPD_USER_HOST
              value: {{ include "hackstream.fullname" . }}-mpd-user
            - name: MPD_USER_PORT
              value: "6600"
            - name: MPD_FALLBACK_HOST
              value: {{ include "hackstream.fullname" . }}-mpd-fallback
            - name: MPD_FALLBACK_PORT
              value: "6601"
            - name: DATA_PATH
              value: "/app/data"
            - name: RECORDINGS_PATH
              value: "/app/data/recordings"
            - name: ROOT_PATH
              value: {{ .Values.backend.env.ROOT_PATH | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
            - name: DEBUG
              value: {{ .Values.backend.env.DEBUG | quote }}
            - name: RELOAD
              value: {{ .Values.backend.env.RELOAD | quote }}
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hackstream.fullname" . }}-secrets
                  key: ADMIN_API_TOKEN
            - name: LIQUIDSOAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hackstream.fullname" . }}-secrets
                  key: LIQUIDSOAP_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hackstream.fullname" . }}-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: music
              mountPath: /music
            - name: songs
              mountPath: /songs
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hackstream.fullname" . }}-recordings
        - name: music
          persistentVolumeClaim:
            claimName: {{ include "hackstream.fullname" . }}-music
        - name: songs
          persistentVolumeClaim:
            {{- if .Values.persistence.songs.enabled }}
            {{- if .Values.persistence.songs.existingClaim }}
            claimName: {{ .Values.persistence.songs.existingClaim }}
            {{- else }}
            claimName: {{ include "hackstream.fullname" . }}-songs
            {{- end }}
            {{- else }}
            claimName: {{ include "hackstream.fullname" . }}-music
            {{- end }}
