{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "hackstream.fullname" . }}
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - websecure
  routes:
    # Block /api/internal/* from external access (IP whitelist)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api/internal`)
      kind: Rule
      middlewares:
        - name: {{ include "hackstream.fullname" . }}-block-internal-api
      services:
        - name: {{ include "hackstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    # Long-polling endpoint with special headers
    - match: Host(`{{ .Values.ingress.host }}`) && Path(`/api/metadata/longpoll`)
      kind: Rule
      middlewares:
        - name: {{ include "hackstream.fullname" . }}-longpolling
      services:
        - name: {{ include "hackstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    # API routes (no prefix stripping - backend expects /api/*)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{ include "hackstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    # Stream endpoint (Liquidsoap Icecast)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/stream`)
      kind: Rule
      services:
        - name: {{ include "hackstream.fullname" . }}-liquidsoap
          port: 8003

    # All other routes (frontend, API without /api prefix, etc.)
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "hackstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- if .Values.ingress.tls.certResolver }}
    certResolver: {{ .Values.ingress.tls.certResolver }}
    {{- end }}
    {{- if .Values.ingress.tls.secretName }}
    secretName: {{ .Values.ingress.tls.secretName }}
    {{- end }}
  {{- end }}
{{- end }}
