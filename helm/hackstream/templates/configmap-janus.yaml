{{- if .Values.janus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hackstream.fullname" . }}-janus
  labels:
    {{- include "hackstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: janus
data:
  janus.jcfg: |
{{ .Files.Get "configs/janus/janus.jcfg" | indent 4 }}
  janus.plugin.streaming.jcfg: |
{{ .Files.Get "configs/janus/janus.plugin.streaming.jcfg" | indent 4 }}
{{- end }}
