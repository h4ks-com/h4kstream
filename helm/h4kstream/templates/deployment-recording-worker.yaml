{{- if .Values.recordingWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "h4kstream.fullname" . }}-recording-worker
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording-worker
  {{- with .Values.recordingWorker.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "h4kstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: recording-worker
  template:
    metadata:
      labels:
        {{- include "h4kstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recording-worker
    spec:
      containers:
        - name: recording-worker
          image: "{{ .Values.recordingWorker.image.repository }}:{{ .Values.recordingWorker.image.tag }}"
          imagePullPolicy: {{ .Values.recordingWorker.image.pullPolicy }}
          command: ["uv", "run", "python", "-m", "app.services.recording_worker"]
          env:
            - name: REDIS_HOST
              value: {{ include "h4kstream.fullname" . }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: LIQUIDSOAP_RECORDING_HOST
              value: {{ include "h4kstream.fullname" . }}-liquidsoap
            - name: LIQUIDSOAP_RECORDING_PORT
              value: "8004"
            - name: JANUS_HOST
              value: {{ include "h4kstream.fullname" . }}-janus
            - name: JANUS_HTTP_PORT
              value: "8088"
            - name: DATA_PATH
              value: "/app/data"
            - name: RECORDINGS_PATH
              value: "/app/data/recordings"
            - name: LOG_LEVEL
              value: {{ .Values.recordingWorker.env.LOG_LEVEL | quote }}
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: ADMIN_API_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: database
              mountPath: /app/data/db
          resources:
            {{- toYaml .Values.recordingWorker.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "h4kstream.fullname" . }}-recordings
        - name: database
          persistentVolumeClaim:
            {{- if .Values.persistence.database.enabled }}
            {{- if .Values.persistence.database.existingClaim }}
            claimName: {{ .Values.persistence.database.existingClaim }}
            {{- else }}
            claimName: {{ include "h4kstream.fullname" . }}-database
            {{- end }}
            {{- end }}
{{- end }}
