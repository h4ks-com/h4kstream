{{- if .Values.mpdFallback.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "h4kstream.fullname" . }}-mpd-fallback
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: mpd-fallback
spec:
  type: ClusterIP
  ports:
    - port: 6601
      targetPort: mpd
      protocol: TCP
      name: mpd
    - port: 8002  # Expose MPD HTTP stream (from mpd-fallback.conf port 8002)
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "h4kstream.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mpd-fallback
{{- end }}
