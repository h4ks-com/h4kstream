{{- if and .Values.persistence.songs.enabled .Values.persistence.songs.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "h4kstream.fullname" . }}-songs
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - {{ .Values.persistence.songs.accessMode }}
  {{- if .Values.persistence.songs.storageClass }}
  storageClassName: {{ .Values.persistence.songs.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.songs.size }}
{{- end }}
