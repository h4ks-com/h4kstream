{{- if .Values.liquidsoap.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "h4kstream.fullname" . }}-liquidsoap
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: liquidsoap
spec:
  type: {{ .Values.liquidsoap.service.type | default "ClusterIP" }}
  ports:
    - port: 1234
      targetPort: telnet
      protocol: TCP
      name: telnet
    - port: 8001
      targetPort: radio
      protocol: TCP
      name: radio
    - port: 8003
      targetPort: icecast
      protocol: TCP
      name: icecast
    - port: 8005
      targetPort: harbor
      protocol: TCP
      name: harbor
  selector:
    {{- include "h4kstream.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: liquidsoap
---
{{- if .Values.liquidsoap.service.directStreaming.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "h4kstream.fullname" . }}-liquidsoap-streaming
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: liquidsoap
    app.kubernetes.io/service-type: direct-streaming
spec:
  type: {{ .Values.liquidsoap.service.directStreaming.type }}
  {{- if and (eq .Values.liquidsoap.service.directStreaming.type "LoadBalancer") .Values.liquidsoap.service.directStreaming.loadBalancerIP }}
  loadBalancerIP: {{ .Values.liquidsoap.service.directStreaming.loadBalancerIP }}
  {{- end }}
  ports:
    - port: {{ .Values.liquidsoap.service.directStreaming.port }}
      targetPort: icecast
      protocol: TCP
      name: streaming
  selector:
    {{- include "h4kstream.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: liquidsoap
{{- end }}
{{- end }}
