apiVersion: v1
kind: Secret
metadata:
  name: {{ include "h4kstream.fullname" . }}-secrets
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_API_TOKEN: {{ .Values.backend.secrets.ADMIN_API_TOKEN | quote }}
  LIQUIDSOAP_TOKEN: {{ .Values.backend.secrets.LIQUIDSOAP_TOKEN | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | quote }}
