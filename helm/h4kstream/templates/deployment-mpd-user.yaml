{{- if .Values.mpdUser.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "h4kstream.fullname" . }}-mpd-user
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: mpd-user
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "h4kstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mpd-user
  template:
    metadata:
      labels:
        {{- include "h4kstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mpd-user
    spec:
      containers:
        - name: mpd-user
          image: "{{ .Values.mpdUser.image.repository }}:{{ .Values.mpdUser.image.tag }}"
          imagePullPolicy: {{ .Values.mpdUser.image.pullPolicy }}
          ports:
            - name: mpd
              containerPort: 6600
              protocol: TCP
            - name: http
              containerPort: 8001  # MPD HTTP stream port (from mpd.conf)
              protocol: TCP
          volumeMounts:
            - name: music
              mountPath: /music
            - name: config
              mountPath: /etc/mpd.conf
              subPath: mpd.conf
            {{- if .Values.persistence.mpdUser.enabled }}
            - name: mpd-data
              mountPath: /var/lib/mpd
            {{- end }}
          resources:
            {{- toYaml .Values.mpdUser.resources | nindent 12 }}
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: {{ include "h4kstream.fullname" . }}-music
        - name: config
          configMap:
            name: {{ include "h4kstream.fullname" . }}-mpd
        {{- if .Values.persistence.mpdUser.enabled }}
        - name: mpd-data
          persistentVolumeClaim:
            {{- if .Values.persistence.mpdUser.existingClaim }}
            claimName: {{ .Values.persistence.mpdUser.existingClaim }}
            {{- else }}
            claimName: {{ include "h4kstream.fullname" . }}-mpd-user
            {{- end }}
        {{- end }}
{{- end }}
