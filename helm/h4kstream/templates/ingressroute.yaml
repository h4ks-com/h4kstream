{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "h4kstream.fullname" . }}
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - websecure
  routes:
    # Block /api/internal/* from external access (IP whitelist)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api/internal`)
      kind: Rule
      middlewares:
        - name: {{ include "h4kstream.fullname" . }}-block-internal-api
      services:
        - name: {{ include "h4kstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    # Long-polling endpoint with special headers
    - match: Host(`{{ .Values.ingress.host }}`) && Path(`/api/metadata/longpoll`)
      kind: Rule
      middlewares:
        - name: {{ include "h4kstream.fullname" . }}-longpolling
      services:
        - name: {{ include "h4kstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    # WebSocket endpoint for real-time events
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api/ws`)
      kind: Rule
      services:
        - name: {{ include "h4kstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    # API routes (no prefix stripping - backend expects /api/*)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{ include "h4kstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    # Radio output stream (Liquidsoap HTTP audio stream)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/radio`)
      kind: Rule
      middlewares:
        - name: {{ include "h4kstream.fullname" . }}-streaming
      services:
        - name: {{ include "h4kstream.fullname" . }}-liquidsoap
          port: 8001

    # Livestream input endpoint (Liquidsoap Icecast harbor)
    # More specific route for /stream/live - strip /stream prefix so liquidsoap gets /live
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/stream/live`)
      kind: Rule
      middlewares:
        - name: {{ include "h4kstream.fullname" . }}-strip-stream-prefix
        - name: {{ include "h4kstream.fullname" . }}-streaming
      services:
        - name: {{ include "h4kstream.fullname" . }}-liquidsoap
          port: 8003

    # Streaming UI page - serve frontend for /stream (without /live)
    - match: Host(`{{ .Values.ingress.host }}`) && Path(`/stream`)
      kind: Rule
      services:
        {{- if .Values.frontend.enabled }}
        - name: {{ include "h4kstream.fullname" . }}-frontend
          port: 80
        {{- else }}
        - name: {{ include "h4kstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
        {{- end }}

    {{- if .Values.janus.enabled }}
    # Janus WebSocket endpoint (WebRTC signaling)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/janusws`)
      kind: Rule
      services:
        - name: {{ include "h4kstream.fullname" . }}-janus
          port: 8188

    # Janus HTTP API endpoint (WebRTC signaling and long-polling)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/janus`)
      kind: Rule
      middlewares:
        - name: {{ include "h4kstream.fullname" . }}-streaming
      services:
        - name: {{ include "h4kstream.fullname" . }}-janus
          port: 8088
    {{- end }}

    # Root and all other routes - serve from frontend (static React app)
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        {{- if .Values.frontend.enabled }}
        - name: {{ include "h4kstream.fullname" . }}-frontend
          port: 80
        {{- else }}
        - name: {{ include "h4kstream.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
        {{- end }}

  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- if .Values.ingress.tls.certResolver }}
    certResolver: {{ .Values.ingress.tls.certResolver }}
    {{- end }}
    {{- if .Values.ingress.tls.secretName }}
    secretName: {{ .Values.ingress.tls.secretName }}
    {{- end }}
  {{- end }}
{{- end }}
