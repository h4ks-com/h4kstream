{{- if .Values.liquidsoap.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "h4kstream.fullname" . }}-liquidsoap
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: liquidsoap
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "h4kstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: liquidsoap
  template:
    metadata:
      labels:
        {{- include "h4kstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: liquidsoap
    spec:
      containers:
        - name: liquidsoap
          image: "{{ .Values.liquidsoap.image.repository }}:{{ .Values.liquidsoap.image.tag }}"
          imagePullPolicy: {{ .Values.liquidsoap.image.pullPolicy }}
          command:
            - liquidsoap
            - /etc/liquidsoap/radio.liq
          env:
            # MPD User - HTTP stream port (not control port)
            - name: MPD_USER_HOST
              value: {{ include "h4kstream.fullname" . }}-mpd-user
            - name: MPD_USER_PORT
              value: "8001"  # HTTP stream port (mpd.conf)
            # MPD Fallback - HTTP stream port (not control port)
            - name: MPD_FALLBACK_HOST
              value: {{ include "h4kstream.fullname" . }}-mpd-fallback
            - name: MPD_FALLBACK_PORT
              value: "8002"  # HTTP stream port (mpd-fallback.conf)
            # Backend API connection
            - name: BACKEND_HOST
              value: {{ include "h4kstream.fullname" . }}-backend
            - name: BACKEND_PORT
              value: "8000"
            - name: BACKEND_BASE_PATH
              value: "/api"  # Backend serves all routes under /api prefix
            # Janus RTP connection (Janus uses hostNetwork)
            {{- if .Values.janus.hostNetwork }}
            - name: JANUS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- else }}
            - name: JANUS_HOST
              value: {{ include "h4kstream.fullname" . }}-janus
            {{- end }}
            - name: JANUS_RTP_PORT
              value: "5002"  # RTP port for streaming to Janus
            # Liquidsoap auth token
            - name: LIQUIDSOAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: LIQUIDSOAP_TOKEN
          ports:
            - name: telnet
              containerPort: 1234
              protocol: TCP
            - name: radio
              containerPort: 8001
              protocol: TCP
            - name: icecast
              containerPort: 8003
              protocol: TCP
            - name: harbor
              containerPort: 8004
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/liquidsoap
            - name: recordings
              mountPath: /recordings
            {{- if .Values.persistence.transitions.enabled }}
            - name: transitions
              mountPath: /transitions
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.liquidsoap.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "h4kstream.fullname" . }}-liquidsoap
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ include "h4kstream.fullname" . }}-recordings
        {{- if .Values.persistence.transitions.enabled }}
        - name: transitions
          persistentVolumeClaim:
            {{- if .Values.persistence.transitions.existingClaim }}
            claimName: {{ .Values.persistence.transitions.existingClaim }}
            {{- else }}
            claimName: {{ include "h4kstream.fullname" . }}-transitions
            {{- end }}
        {{- end }}
{{- end }}
