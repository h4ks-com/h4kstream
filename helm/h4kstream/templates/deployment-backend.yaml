apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "h4kstream.fullname" . }}-backend
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.backend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "h4kstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "h4kstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: {{ include "h4kstream.fullname" . }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: JANUS_HOST
              {{- if .Values.janus.hostNetwork }}
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
              {{- else }}
              value: {{ include "h4kstream.fullname" . }}-janus
              {{- end }}
            - name: JANUS_HTTP_PORT
              value: "8088"
            - name: JANUS_ADMIN_PORT
              value: "8089"
            - name: JANUS_WS_PORT
              value: "8188"
            - name: MPD_USER_HOST
              value: {{ include "h4kstream.fullname" . }}-mpd-user
            - name: MPD_USER_PORT
              value: "6600"
            - name: MPD_FALLBACK_HOST
              value: {{ include "h4kstream.fullname" . }}-mpd-fallback
            - name: MPD_FALLBACK_PORT
              value: "6601"
            - name: LIQUIDSOAP_TELNET_HOST
              value: {{ include "h4kstream.fullname" . }}-liquidsoap
            - name: LIQUIDSOAP_TELNET_PORT
              value: "1234"
            - name: DATA_PATH
              value: "/app/data"
            - name: RECORDINGS_PATH
              value: "/app/data/recordings"
            - name: ROOT_PATH
              value: {{ .Values.backend.env.ROOT_PATH | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
            - name: DEBUG
              value: {{ .Values.backend.env.DEBUG | quote }}
            - name: RELOAD
              value: {{ .Values.backend.env.RELOAD | quote }}
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: ADMIN_API_TOKEN
            - name: LIQUIDSOAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: LIQUIDSOAP_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: LOGTO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: LOGTO_ENDPOINT
            - name: LOGTO_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: LOGTO_APP_ID
            - name: LOGTO_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: LOGTO_APP_SECRET
            - name: LOGTO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: LOGTO_REDIRECT_URI
            - name: NAVIDROME_URL
              value: {{ .Values.backend.env.NAVIDROME_URL | quote }}
            - name: NAVIDROME_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: NAVIDROME_USER
            - name: NAVIDROME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "h4kstream.fullname" . }}-secrets
                  key: NAVIDROME_PASSWORD
            {{- if .Values.backend.ytdlp.cookiesEnabled }}
            - name: YTDLP_COOKIES_FILE
              value: /app/cookies/cookies.txt
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: database
              mountPath: /app/data/db
            - name: music
              mountPath: /music
            - name: songs
              mountPath: /songs
            {{- if .Values.backend.ytdlp.cookiesEnabled }}
            - name: ytdlp-cookies
              mountPath: /app/cookies
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "h4kstream.fullname" . }}-recordings
        - name: database
          persistentVolumeClaim:
            {{- if .Values.persistence.database.enabled }}
            {{- if .Values.persistence.database.existingClaim }}
            claimName: {{ .Values.persistence.database.existingClaim }}
            {{- else }}
            claimName: {{ include "h4kstream.fullname" . }}-database
            {{- end }}
            {{- else }}
            claimName: {{ include "h4kstream.fullname" . }}-recordings
            {{- end }}
        - name: music
          persistentVolumeClaim:
            claimName: {{ include "h4kstream.fullname" . }}-music
        - name: songs
          persistentVolumeClaim:
            {{- if .Values.persistence.songs.enabled }}
            {{- if .Values.persistence.songs.existingClaim }}
            claimName: {{ .Values.persistence.songs.existingClaim }}
            {{- else }}
            claimName: {{ include "h4kstream.fullname" . }}-songs
            {{- end }}
            {{- else }}
            claimName: {{ include "h4kstream.fullname" . }}-music
            {{- end }}
        {{- if .Values.backend.ytdlp.cookiesEnabled }}
        - name: ytdlp-cookies
          secret:
            secretName: {{ include "h4kstream.fullname" . }}-ytdlp-cookies
        {{- end }}
