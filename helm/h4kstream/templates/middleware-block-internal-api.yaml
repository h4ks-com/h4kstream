{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "h4kstream.fullname" . }}-block-internal-api
  labels:
    {{- include "h4kstream.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.ingress.internalApiWhitelist }}
      - {{ . }}
      {{- end }}
{{- end }}
