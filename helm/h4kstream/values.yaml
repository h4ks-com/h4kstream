# Default values for h4kstream
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  domain: h4kstream.local
  volumePath: /data/h4kstream

  # Node IPs for hostNetwork services (like Janus)
  # For single-node clusters, this should be the node's internal IP
  # Get with: kubectl get nodes -o wide
  nodeIPs:
    - "192.168.2.210"  # Default to detected k3s node IP

# Backend API configuration
backend:
  replicaCount: 3

  image:
    repository: mattfly/h4kstream-backend
    pullPolicy: IfNotPresent
    tag: "latest"

  # Keel annotations for automatic updates from DockerHub
  annotations:
    keel.sh/policy: force      # Force update even if tag is same
    keel.sh/trigger: poll      # Poll DockerHub for new images
    keel.sh/pollSchedule: "@every 5m"  # Check every 5 minutes

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Horizontal Pod Autoscaler (optional)
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    ROOT_PATH: "/api"
    LOG_LEVEL: "INFO"
    DEBUG: "false"
    RELOAD: "false"

  # Secrets - Override in production!
  secrets:
    ADMIN_API_TOKEN: "changeme"
    LIQUIDSOAP_TOKEN: "changeme"
    JWT_SECRET: "changeme"

  # Service configuration
  service:
    type: ClusterIP
    port: 8000

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1  # Static SPA, no need for multiple replicas

  image:
    repository: mattfly/h4kstream-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  # Keel annotations for automatic updates from DockerHub
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Webhook worker configuration
webhookWorker:
  enabled: true

  image:
    repository: mattfly/h4kstream-backend
    pullPolicy: IfNotPresent
    tag: "latest"

  # Keel annotations for automatic updates from DockerHub
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  env:
    LOG_LEVEL: "INFO"

# Recording worker configuration
recordingWorker:
  enabled: true

  image:
    repository: mattfly/h4kstream-backend
    pullPolicy: IfNotPresent
    tag: "latest"

  # Keel annotations for automatic updates from DockerHub
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  env:
    LOG_LEVEL: "INFO"

# Redis configuration
redis:
  enabled: true

  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent

  persistence:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 1Gi
    storageClass: ""  # Use default or specify (e.g., "nfs")
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# MPD User instance configuration
mpdUser:
  enabled: true

  image:
    repository: gists/mpd
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# MPD Fallback instance configuration
mpdFallback:
  enabled: true

  image:
    repository: gists/mpd
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Liquidsoap configuration
liquidsoap:
  enabled: true

  image:
    repository: savonet/liquidsoap
    tag: v2.4.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Janus WebRTC Gateway configuration
janus:
  enabled: true

  # IMPORTANT: hostNetwork is required for mDNS candidates from browser
  hostNetwork: true

  # Node IP for Janus when using hostNetwork mode
  # If not set, uses global.nodeIPs[0]
  # Janus runs on the host network, so it's accessible at the node's IP
  # Get with: kubectl get nodes -o wide (use INTERNAL-IP)
  nodeIP: ""  # Leave empty to use global.nodeIPs[0]

  # Use DaemonSet for predictable node assignment (optional)
  useDaemonSet: false

  # Node selector for Janus pods (useful with DaemonSet)
  nodeSelector: {}
  # Example:
  # janus-capable: "true"

  image:
    repository: canyan/janus-gateway
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Persistent storage configuration
persistence:
  # Music library storage (shared across MPD instances)
  music:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 50Gi
    storageClass: ""  # Use default or specify (e.g., "nfs")
    accessMode: ReadWriteMany  # Requires NFS or similar for RWX

  # Recordings storage
  recordings:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 100Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Redis persistence
  redis:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Transitions storage (custom audio transitions for liquidsoap)
  transitions:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 10Gi
    storageClass: ""
    accessMode: ReadOnlyMany

  # Songs storage (backend processing)
  songs:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteMany

  # MPD User database
  mpdUser:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # MPD Fallback database
  mpdFallback:
    enabled: true
    create: true  # Set to false to use existing PVC
    existingClaim: ""  # Name of existing PVC (if create: false)
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Ingress configuration (Traefik)
ingress:
  enabled: true
  className: traefik

  # Custom annotations (optional)
  annotations: {}

  # Domain configuration
  host: ""  # Set to your domain (e.g., "h4kstream.example.com")

  # TLS configuration
  tls:
    enabled: false
    secretName: ""  # Cert-manager will create this
    certResolver: ""  # For cert-manager (e.g., "cloudflare")

  # Route configurations
  routes:
    api:
      enabled: true
      path: /api
      pathType: Prefix
      service: backend
      port: 8000

    janus:
      enabled: true
      path: /janus
      pathType: Prefix
      service: janus
      port: 8088

    janusws:
      enabled: true
      path: /janusws
      pathType: Prefix
      service: janus
      port: 8188

    stream:
      enabled: true
      path: /stream
      pathType: Prefix
      service: liquidsoap
      port: 8003

    radio:
      enabled: true
      path: /radio
      pathType: Prefix
      service: liquidsoap
      port: 8001

  # Custom middlewares (users can add rate limiting, CORS, etc.)
  customMiddlewares: []
  # Example:
  # - name: rate-limit
  #   spec:
  #     rateLimit:
  #       average: 100
  #       burst: 50

# Service configuration
service:
  type: ClusterIP

  backend:
    port: 8000
    targetPort: 8000

  redis:
    port: 6379
    targetPort: 6379

  mpdUser:
    control: 6600
    stream: 8001

  mpdFallback:
    control: 6601
    stream: 8002

  liquidsoap:
    harbor: 8003
    recording: 8004

  janus:
    http: 8088
    ws: 8188
    rtp: 5002

# Name overrides
nameOverride: ""
fullnameOverride: ""
